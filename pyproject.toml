[tool.pytest.ini_options]
# Tests live with the code they cover: helpers/tests, inference/tests,
# interface/tests, iwantto/tests, silicon/tests, diagnostics/tests, prompts/tests.
testpaths = [
    "helpers",
    "inference",
    "interface",
    "iwantto",
    "silicon",
    "worker",
    "diagnostics",
    "prompts",
]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
