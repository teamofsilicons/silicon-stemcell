name: Check Silicon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Check installer and packaging syntax
        run: |
          sh -n install.sh
          python3 -m py_compile scripts/package-apps.py
      - name: Check standalone Windows launcher source
        run: |
          cargo fmt --manifest-path windows/launcher/Cargo.toml --all -- --check
          cargo check --manifest-path windows/launcher/Cargo.toml --locked
          cargo clippy --manifest-path windows/launcher/Cargo.toml --locked --all-targets -- -D warnings
          bash -n windows/launch.sh
          sh -n windows/provision.sh windows/interop.sh
