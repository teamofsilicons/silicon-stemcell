name: Verify public Windows install

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag
        required: true
      test_arm_runtime:
        description: Also use an available physical Windows ARM64 self-hosted runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  x64:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Actual public installer and runtime through Windows PowerShell 5.1
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./tests/windows.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-public-x64-diagnostics
          path: |
            ${{ runner.temp }}/windows-diagnostics.tar.gz
            ${{ runner.temp }}/windows-native-daemon.log
            ${{ runner.temp }}/windows-native-daemon.err
          if-no-files-found: ignore

  arm64:
    if: inputs.test_arm_runtime
    runs-on: [self-hosted, Windows, ARM64, silicon-wsl2]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Actual public ARM64 installer and runtime
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./tests/windows.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-public-arm64-diagnostics
          path: |
            ${{ runner.temp }}/windows-diagnostics.tar.gz
            ${{ runner.temp }}/windows-native-daemon.log
            ${{ runner.temp }}/windows-native-daemon.err
          if-no-files-found: ignore
