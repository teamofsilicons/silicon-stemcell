name: Release Silicon

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag or source revision to build
        required: true
      build_only:
        description: Validate and upload bundles without creating a draft release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            apps_target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            apps_target: linux-aarch64
          - runner: macos-15
            target: aarch64-apple-darwin
            apps_target: macos-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            apps_target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_ONLY: ${{ inputs.build_only }}
      APPS_TELEMETRY: '0'
      ACCOUNTS_TELEMETRY: 'off'
      DO_NOT_TRACK: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-target
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate the source version and release tag
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if os.environ.get('BUILD_ONLY') != 'true':
              assert os.environ['RELEASE_TAG'] == f'v{version}', 'release tag must match Cargo.toml'
          default = re.search(r'version=\$\{SILICON_VERSION:-(.+?)\}', pathlib.Path('install.sh').read_text()).group(1)
          assert default == f'v{version}', 'installer default must match the release version'
          assert tomllib.loads(pathlib.Path('windows/launcher/Cargo.toml').read_text())['package']['version'] == version
          assert f"[string]$Version = 'v{version}'" in pathlib.Path('install.ps1').read_text()
          PY
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify interpreter
        run: |
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked --lib
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the complete bundle
        env:
          SILICON_PREFIX: ${{ runner.temp }}/silicon-bundle
          SILICON_SOURCE_DIR: ${{ github.workspace }}
          SILICON_APPS_NO_DAEMON: '1'
        run: sh install.sh
      - name: Check bundled CLI executables without authenticating
        env:
          BUNDLE_BIN: ${{ runner.temp }}/silicon-bundle/bin
        run: |
          for binary in silicon si silicon-omni omni so; do
            "$BUNDLE_BIN/$binary" --help >/dev/null
          done
          "$BUNDLE_BIN/omnid" --version
          "$BUNDLE_BIN/caddy" version
          "$BUNDLE_BIN/silicon" accounts --json
          "$BUNDLE_BIN/silicon" login status --json
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          APPS_TARGET: ${{ matrix.apps_target }}
        run: |
          mkdir -p dist
          tar -czf "dist/silicon-$TARGET.tar.gz" -C "$RUNNER_TEMP/silicon-bundle/lib/silicon/current" bin VERSION installer.sh LICENSE LICENSES
          cp install.sh dist/install.sh
          python3 scripts/package-apps.py "$RUNNER_TEMP/silicon-bundle/lib/silicon/current" "$APPS_TARGET" "dist/silicon-apps-$TARGET.tar.gz" --apps "$RUNNER_TEMP/silicon-bundle/bin/silicon-apps"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows.yml
    with:
      bundle_run_id: ${{ format('{0}', github.run_id) }}
      source_ref: ${{ inputs.tag || github.ref_name }}

  draft:
    if: ${{ !inputs.build_only }}
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum and create a reviewable draft
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum silicon-*.tar.gz silicon-*.zip install.sh install.ps1 > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Silicon 7.0.8 fixes an ISI that stayed busy indefinitely after Claude merged several queued messages into one turn, which also skipped every later heartbeat to it and kept the interpreter from restarting for updates.

          Bundled Omni 0.10.5 acknowledges each message in such a merged replay. Claude ends every merged block but the last with an added newline, and Omni 0.10.4 rejected that as padding, so none of them received START or INJECTED and all stayed pending. Trailing whitespace may now differ in either direction; leading whitespace and empty echoes still never match.

          Complete macOS and Linux bundles, catalog package archives, and Windows WSL2 bundles are included. No configuration migration is required from 7.0.7. Messages already stuck pending in an Omni session were delivered and should be reconciled rather than replayed. Installers preserve credentials and runtime data. Windows ARM64 remains a preview. Verify downloads against SHA256SUMS.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Silicon $RELEASE_TAG" --notes-file release-notes.md silicon-*.tar.gz silicon-*.zip install.sh install.ps1 SHA256SUMS
