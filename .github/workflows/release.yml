name: Release Silicon

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag or source revision to build
        required: true
      build_only:
        description: Validate and upload bundles without creating a draft release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_ONLY: ${{ inputs.build_only }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-target
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate the source version and release tag
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if os.environ.get('BUILD_ONLY') != 'true':
              assert os.environ['RELEASE_TAG'] == f'v{version}', 'release tag must match Cargo.toml'
          default = re.search(r'version=\$\{SILICON_VERSION:-(.+?)\}', pathlib.Path('install.sh').read_text()).group(1)
          assert default == f'v{version}', 'installer default must match the release version'
          assert tomllib.loads(pathlib.Path('windows/launcher/Cargo.toml').read_text())['package']['version'] == version
          assert f"[string]$Version = 'v{version}'" in pathlib.Path('install.ps1').read_text()
          PY
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify interpreter
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          python3 tests/ting_migration.py
          python3 scripts/test-migrate-identifiers.py
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the complete bundle
        env:
          SILICON_PREFIX: ${{ runner.temp }}/silicon-bundle
          SILICON_SOURCE_DIR: ${{ github.workspace }}
          SILICON_INTERPRETER_TABLE_KEY: ${{ secrets.SILICON_INTERPRETER_TABLE_KEY }}
          SILICON_RUNTIME_TABLE_KEY: ${{ secrets.SILICON_RUNTIME_TABLE_KEY }}
        run: sh install.sh
      - name: Exercise the installed bundle with the real Omni daemon and Caddy
        env:
          SILICON_TEST_BIN_DIR: ${{ runner.temp }}/silicon-bundle/bin
          OMNI_DAEMON: ${{ runner.temp }}/silicon-bundle/bin/omnid
          SILICON_CADDY: ${{ runner.temp }}/silicon-bundle/bin/caddy
        run: python3 tests/e2e.py
      - name: Check bundled CLI executables without authenticating
        env:
          BUNDLE_BIN: ${{ runner.temp }}/silicon-bundle/bin
        run: |
          for binary in silicon si silicon-omni omni so; do
            "$BUNDLE_BIN/$binary" --help >/dev/null
          done
          "$BUNDLE_BIN/omnid" --version
          "$BUNDLE_BIN/caddy" version
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/silicon-$TARGET.tar.gz" -C "$RUNNER_TEMP/silicon-bundle/lib/silicon/current" bin VERSION installer.sh LICENSE LICENSES
          cp install.sh dist/install.sh
          cp scripts/migrate-identifiers.py scripts/migrate-ting-state.py docs/PUBLIC-IDENTIFIER-MIGRATION.md dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows.yml
    with:
      bundle_run_id: ${{ format('{0}', github.run_id) }}
      source_ref: ${{ inputs.tag || github.ref_name }}

  draft:
    if: ${{ !inputs.build_only }}
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum and create a reviewable draft
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum silicon-*.tar.gz silicon-*.zip install.sh install.ps1 migrate-identifiers.py migrate-ting-state.py PUBLIC-IDENTIFIER-MIGRATION.md > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Silicon 6.1.0 adds reusable Starter genes, functions, and ISIs, and organizes application declarations under each ISI.

          Use `starter:gene:ID` in DNA, `starter:function:ID` in flow calls or function imports, and `starter:isi:ID: default` to inherit a published ISI. ISI mappings override published defaults recursively. Downloads live in `SILICON_HOME/.fromstarter`, refresh on reconnect, and remain cached for live flow loading. Optional SHA-256 versions pin a publication. The Starter CLI verifies downloads and is installed through Honeycomb when needed; private blocks require an existing authorized Starter login.

          Apps declared by local and imported ISIs are installed and authenticated as one shared set. The lists organize intended use and do not restrict other ISIs. Honeycomb app names, IDs, help commands, and descriptions are included in DNA, with cached metadata retained when lookup is unavailable. `si app install` records the app on the calling ISI; uninstall removes the shared app declarations and configuration.

          Existing 6.0 configurations, including legacy `silicon.apps` and `silicon.login`, remain compatible. Update with `silicon update`, then disconnect and reconnect to adopt new Starter publications or manual configuration changes. Duplicate connections are rejected before refreshing files used by live workers.

          **Upgrading from 5.x still requires the 6.0 flow migration:** use `self.error` in catches, account for default send aggregation, and prepare the edits before updating. See the [flow migration guide](https://docs.teamofsilicons.com/#flow-migration). Upgrading from 4.x also requires the included `PUBLIC-IDENTIFIER-MIGRATION.md`.

          Bundles retain unattended autostart and recovery, durable delivery, Omni 0.9.1, and Caddy. Honeycomb is installed independently; IAM, Ting, and configured applications install through Honeycomb on connect.

          Windows x64 uses WSL2 and runs the real runtime suite. Windows ARM64 remains preview: native launcher and Linux ARM64 checks run, but physical Windows ARM64 WSL2 E2E is not yet verified. Windows requires hardware virtualization; restart and resume installation if requested.

          Verify downloads against `SHA256SUMS`. Binaries are verified before activation. Installers preserve Silicon YAML, credentials, and runtime data; they do not migrate flow source automatically.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Silicon $RELEASE_TAG" --notes-file release-notes.md silicon-*.tar.gz silicon-*.zip install.sh install.ps1 migrate-identifiers.py migrate-ting-state.py PUBLIC-IDENTIFIER-MIGRATION.md SHA256SUMS
