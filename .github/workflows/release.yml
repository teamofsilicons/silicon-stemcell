name: Release Silicon

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag or source revision to build
        required: true
      build_only:
        description: Validate and upload bundles without creating a draft release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_ONLY: ${{ inputs.build_only }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-target
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate the source version and release tag
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if os.environ.get('BUILD_ONLY') != 'true':
              assert os.environ['RELEASE_TAG'] == f'v{version}', 'release tag must match Cargo.toml'
          default = re.search(r'version=\$\{SILICON_VERSION:-(.+?)\}', pathlib.Path('install.sh').read_text()).group(1)
          assert default == f'v{version}', 'installer default must match the release version'
          assert tomllib.loads(pathlib.Path('windows/launcher/Cargo.toml').read_text())['package']['version'] == version
          assert f"[string]$Version = 'v{version}'" in pathlib.Path('install.ps1').read_text()
          PY
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify interpreter
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the complete bundle
        env:
          SILICON_PREFIX: ${{ runner.temp }}/silicon-bundle
          SILICON_SOURCE_DIR: ${{ github.workspace }}
          SILICON_INTERPRETER_TABLE_KEY: ${{ secrets.SILICON_INTERPRETER_TABLE_KEY }}
          SILICON_RUNTIME_TABLE_KEY: ${{ secrets.SILICON_RUNTIME_TABLE_KEY }}
        run: sh install.sh
      - name: Exercise the installed bundle with the real Omni daemon and Caddy
        env:
          SILICON_TEST_BIN_DIR: ${{ runner.temp }}/silicon-bundle/bin
          OMNI_DAEMON: ${{ runner.temp }}/silicon-bundle/bin/omnid
          SILICON_CADDY: ${{ runner.temp }}/silicon-bundle/bin/caddy
        run: python3 tests/e2e.py
      - name: Check bundled CLI executables without authenticating
        env:
          BUNDLE_BIN: ${{ runner.temp }}/silicon-bundle/bin
        run: |
          for binary in silicon si silicon-omni omni so; do
            "$BUNDLE_BIN/$binary" --help >/dev/null
          done
          "$BUNDLE_BIN/omnid" --version
          "$BUNDLE_BIN/caddy" version
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/silicon-$TARGET.tar.gz" -C "$RUNNER_TEMP/silicon-bundle/lib/silicon/current" bin VERSION installer.sh LICENSE LICENSES
          cp install.sh dist/install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows.yml
    with:
      bundle_run_id: ${{ format('{0}', github.run_id) }}
      source_ref: ${{ inputs.tag || github.ref_name }}

  draft:
    if: ${{ !inputs.build_only }}
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum and create a reviewable draft
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum silicon-*.tar.gz silicon-*.zip install.sh install.ps1 > SHA256SUMS
          printf '%s\n' 'Rust interpreter runtime: silicon, si, Omni, and Caddy. Honeycomb is installed independently; configured apps install their latest Honeycomb releases on each connect without version pins.' 'Upgrade from 4.0.5 or earlier: rerun this release’s installer into the same prefix; older embedded updaters require the former bundled app inventory. YAML, credentials, and session state are preserved.' 'Windows x64 uses WSL2 and passes the real runtime suite. Windows ARM64 is preview: native launcher and Linux ARM64 tests pass, but physical Windows ARM64 WSL2 E2E is not yet verified.' 'Windows requires WSL2 and hardware virtualization. Restart and resume installation if Windows requests it. YAML and credentials stay on the Linux filesystem; /mnt/c accesses Windows data.' 'Binaries are verified before activation; Silicon YAML and runtime data are never part of the bundle.' > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Silicon $RELEASE_TAG" --notes-file release-notes.md silicon-*.tar.gz silicon-*.zip install.sh install.ps1 SHA256SUMS
