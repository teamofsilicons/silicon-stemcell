name: Validate Silicon Release

on:
  pull_request:
    paths:
      - ".github/workflows/validate-release.yml"
      - "requirements.lock"
      - "requirements.txt"
      - "scripts/verify_release_runtime.py"
      - "silicon.info"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: silicon-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the runtime-contract validator CLI
        run: |
          python -m pip install --disable-pip-version-check "silicon-cli==1.0.52"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release metadata and runtime image
        run: python scripts/verify_release_runtime.py
