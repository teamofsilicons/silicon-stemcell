silicon:
  id: ...
  org_id: ...
  token: ...
  timezone: America/Los_Angeles
  SILICON_HOME: ! pwd
  SILICON_ORG: ...

  space_station:
    table_name: ...
    table_key: ...

  inference_providers:
    - all-available-providers

  setup:
    - ! ./install_python.sh
  
  apps:
    - dm
    - briefcase
    - hook
    - browser
    - waveform
  
  app_configs:
    waveform:
      default_tts_provider: google


isi:
  intuit:
    model: fast
    primary_send_mode: global # or session
    session_type: persistent

    dna:
      assemble:
        - silicon.md
        - ! cat intuit.md
        - ! ./contacts.sh !>> "You have no contacts"
        - learn.sh
        - ! ./tools.sh --include [dm, briefcase, iam, waveform, commit, remind, hook]
        - ../memories/learnings/workers/advertising.md
      next_refresh: 30min # time in min or shell evaluating to Xmin or a new session started, whichever is sooner. evaluated at each refresh.

    heartbeat:
      next: 13min # or shell command that evaluates to a Xmin time.
      message: This is a heartbeat. Make it count.

    new_session_suggestion:
      cooldown_minutes: 30 # in mins
      min_new_messages: 10 # after N messages
      suggestion_message: Good time to start a new session? Write anything in context into memories before starting a new session. To start a new session, run the command: `si session new --archive-current-session --id '...' --title '...' --description '...'` stored inside SILICON_HOME/.silicon/sessions/archived/{isi}/ with id, session id, title, description (summary), and first (invication) & last (session completion/archive) timestamp.

  deliberate:
    model: general
    primary_send_mode: global
    session_type: persistent

    dna:
      assemble:
        - silicon.md
        - ! cat deliberate.md
        - ! ./contacts.sh
        - learn.sh
        - ! ./tools.sh --include [dm, briefcase, iam, waveform, commit, remind, hook, worker]
        - ../memories/learnings/workers/advertising.md
      next_refresh: 30min
    
    heartbeat:
      next: 41min # or shell command that evaluates to a Xmin time.
      message: This is a heartbeat. Make it count.

    new_session_suggestion:
      cooldown_minutes: 60 # in mins
      min_new_messages: 5 # after N messages
      suggestion_message: Good time to start a new session? Write anything in context into memories before starting a new session. To start a new session, run the command: `si deliberate start-new-session --archive-current-session --id '...' --title '...' --summary '...'` stored inside SILICON_HOME/.silicon/sessions/archived/{isi}/ with id, session id, title, description (summary), and first (invication) & last (session completion/archive) timestamp.

  advisor:
    model: research
    primary_send_mode: global
    session_type: persistent

    dna:
      assemble:
        - silicon.md
        - ! cat advisor.md
        - ! ./team.sh
        - learn.sh
        - ! ./tools.sh --include [dm, briefcase, iam, waveform, commit, remind, hook]
        - ../memories/learnings/workers/advertising.md
      next_refresh: 30min

    heartbeat:
      next: 41min # or shell command that evaluates to a Xmin time.
      message: This is a heartbeat. Make it count.

    new_session_suggestion:
      cooldown_minutes: 60 # in mins
      min_new_messages: 5 # after N messages
      suggestion_message: Good time to start a new session? Write anything in context into memories before starting a new session. To start a new session, run the command: `si advisor start-new-session --archive-current-session --id '...' --title '...' --summary '...'` stored inside SILICON_HOME/.silicon/sessions/archived/{isi}/ with id, session id, title, description (summary), and first (invication) & last (session completion/archive) timestamp.

  worker.terminal:
    model: code
    primary_send_mode: session # each invocation needs a id, title, and message. or msg archived sessions with an id and msg.
    session_type: ephemeral

    dna:
      assemble:
        - silicon.md
        - ! cat workers/terminal.md
        - ! ./tools.sh --include [dm, briefcase, iam, waveform, commit, remind, hook]
      next_refresh: 30min

  worker.browser:
    model: fast
    primary_send_mode: session
    session_type: ephemeral

    dna:
      assemble:
        - silicon.md
        - ! cat workers/browser.md
        - ../memories/learnings/workers/browser/silicon-browser.md
        - ! ./tools.sh --include [dm, briefcase, iam, waveform, commit, remind, hook]
      next_refresh: 30min
    
  worker.creative:
    model: design
    primary_send_mode: session
    session_type: ephemeral

    dna:
      assemble:
        - silicon.md
        - ! cat workers/creative.md
        - ../memories/learnings/workers/creative/algorithm-for-creativity.md
        - ! ./tools.sh --include [dm, briefcase, iam, waveform, commit, remind, hook]
      next_refresh: 30min

access:
  intuit: [deliberate]
  deliberate: [intuit, advisor, worker.terminal, worker.browser, worker.creative]
  advisor: [deliberate]
  worker.terminal: [deliberate]
  worker.browser: [deliberate]
  worker.creative: [deliberate]

# run everytime silicon is pinged at its connection URL ({handle}.{org_id}.localhost when both are DNS labels)
# Ting delivers these objects inside request.tings; each also includes an id.
# {
#   type: "new_message", # message_sent, event, or anything else.
#   data: {
#     msg_id: "msg-1234567890",
#     message: "Where are we?",
#     from: "@c:shubham",
#     to: "deliberate@si:assistant",
#     sender_timezone: "Asia/Kolkata",
#     sent_at: "2026-09-10T03:12:34Z",

#     reply_to: {
#       msg_id: "msg-0987654321",
#       message: "I'm close to finishing the task. Will update you soon.",
#       from: "deliberate@si:assistant", # worker.terminal:session-id@si:assistant for non sticky isi
#       to: "@c:shubham",
#       sender_timezone: "Asia/Kolkata",
#       sent_at: "2026-09-10T03:12:11Z",
#     },
#   },
#   metadata: {
#     app: "dm",
#     timestamp: "2024-06-10T12:00:00Z",
#   }
# }
flow:
  - var: {name: ting_index, value: 0}
  # Expand each ting into ordered steps; keep event data behind a CEL lookup.
  - |-
      {request.tings.map(ting, [
        {"var": {"name": "ting", "value": "{request.tings[var.ting_index]}"}},
        {
          "var": {
            "name": "ting_kind",
            "value": "{(var.ting.type in [\"new_message\", \"dm.msg.received\", \"tos>dm.msg.received\"] && has(var.ting.data.from) && has(var.ting.data.to) && has(var.ting.data.sent_at) && has(var.ting.data.msg_id) && has(var.ting.data.message) && has(var.ting.data.sender_timezone)) ? \"new_message\" : (var.ting.type in [\"message_sent\", \"dm.msg.sent\", \"tos>dm.msg.sent\"] && has(var.ting.data.from) && has(var.ting.data.to) && has(var.ting.data.sent_at) && has(var.ting.data.msg_id) && has(var.ting.data.message)) ? \"message_sent\" : (var.ting.type == \"event\" && has(var.ting.data.timestamp)) ? \"event\" : \"other\"}"
          }
        },
        {
          "if": {
            "condition": "{var.ting_kind == \"new_message\"}",
            "then": [
              {
                "var": {
                  "name": "new_message",
                  "value": "New message from {var.ting.data.from} to {var.ting.data.to} at {tz_time(var.ting.data.sent_at, var.ting.data.sender_timezone)} sender time, or {tz_time(var.ting.data.sent_at, silicon.timezone)} your time:\\n\\n<|message:{var.ting.data.msg_id}|>\\n{var.ting.data.message}\\n<|message:{var.ting.data.msg_id}|>"
                }
              }
            ]
          }
        },
        {
          "if": {
            "condition": "{var.ting_kind == \"new_message\" && var.ting.data.to.startswith(\"deliberate\")}",
            "then": [
              {"send": {"isi": "deliberate", "message": "{var.new_message}", "catch": null}},
              {
                "send": {"isi": "intuit", "message": "Deliberate got a direct reply & has been sent to deleberate. This is for your information only.\\n{var.new_message}"}
              }
            ]
          }
        },
        {
          "if": {
            "condition": "{var.ting_kind == \"new_message\" && var.ting.data.to.startswith(\"deliberate\") && has(var.ting.data.reply_to) && var.ting.data.reply_to != null}",
            "then": [
              {
                "var": {
                  "name": "time_delay",
                  "value": "! './time_delay.sh {tz_time(var.ting.data.sent_at, var.ting.data.sender_timezone)} {convert_time(var.ting.data.reply_to.sent_at, var.ting.data.reply_to.sender_timezone)}'",
                  "catch": [{"var": {"name": "time_delay", "value": "unknown"}}]
                }
              },
              {
                "send": {
                  "isi": "advisor",
                  "message": "Deliberate got a direct reply which was sent after a delay of {var.time_delay}. This is for your information only.",
                  "catch": [
                    {"var": {"name": "advisor_error", "value": "{error}"}},
                    {"send": {"isi": "intuit", "message": "Advisor got an error {var.advisor_error}"}},
                    {"log": {"message": "Advisor got an error {var.advisor_error}"}}
                  ]
                }
              }
            ]
          }
        },
        {
          "if": {
            "condition": "{var.ting_kind == \"new_message\" && var.ting.data.to.startswith(\"worker\")}",
            "then": [
              {"var": {"name": "worker", "value": "{var.ting.data.to.split(\"@\")[0]}"}},
              {"send": {"isi": "deliberate", "message": "Worker {var.worker} got a direct message. This is for your information only\\n{var.new_message}"}},
              {"send": {"isi": "intuit", "message": "Worker {var.worker} got a direct message. This is for your information only.\\n{var.new_message}"}},
              {"var": {"name": "worker_isi", "value": "{var.worker.split(\":\")[0]}"}},
              {"var": {"name": "worker_session_id", "value": "{var.worker.split(\":\")[1]}"}},
              {"send": {"isi": "{var.worker_isi}", "session_id": "{var.worker_session_id}", "message": "{var.new_message}"}}
            ]
          }
        },
        {
          "if": {
            "condition": "{var.ting_kind == \"new_message\" && var.ting.data.to.startswith(\"advisor\")}",
            "then": [
              {"send": {"isi": "advisor", "message": "{var.new_message}"}},
              {"send": {"isi": "intuit", "message": "Advisor got a direct reply & has been sent to advisor. This is for your information only.\\n{var.new_message}"}}
            ]
          }
        },
        {
          "if": {
            "condition": "{var.ting_kind == \"new_message\" && !var.ting.data.to.startswith(\"deliberate\") && !var.ting.data.to.startswith(\"worker\") && !var.ting.data.to.startswith(\"advisor\")}",
            "then": [{"send": {"isi": "intuit", "message": "{var.new_message}"}}]
          }
        },
        {
          "if": {
            "condition": "{var.ting_kind == \"message_sent\"}",
            "then": [
              {
                "var": {
                  "name": "message_sent_recipt",
                  "value": "New message sent by {var.ting.data.from} to {var.ting.data.to} at {tz_time(var.ting.data.sent_at, silicon.timezone)} your time:\\n\\n<|message:{var.ting.data.msg_id}|>\\n{var.ting.data.message}\\n<|message:{var.ting.data.msg_id}|>"
                }
              },
              {"send": {"isi": "intuit", "message": "{var.message_sent_recipt}"}}
            ]
          }
        },
        {
          "if": {
            "condition": "{var.ting_kind == \"event\"}",
            "then": [
              {
                "var": {"name": "event", "value": "New event received at {tz_time(var.ting.data.timestamp, silicon.timezone)} your time:\\n\\n{make_readable(var.ting.data)}"}
              },
              {"send": {"isi": "intuit", "message": "{var.event}"}}
            ]
          }
        },
        {
          "if": {"condition": "{var.ting_kind == \"other\"}", "then": [{"send": {"isi": "intuit", "message": "New Ting notification:\\n{make_readable(var.ting)}"}}]}
        },
        {"var": {"name": "ting_index", "value": "{var.ting_index + 1}"}}
      ]).flatten()}
